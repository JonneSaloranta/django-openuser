[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-openuser"
version = "1.0.0"
description = "Reusable Django custom usermodel app for NGOs and small businesses"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "django>=5.2,<6.0",
    "django-admin>=2.0.0,<3.0.0",
    "pillow>=12.0,<13.0",
    "python-decouple>=3.8,<4.0",
    "django-widget-tweaks>=1.5.1,<2.0",
    "coverage>=7.14.0,<8.0.0",
    "django-phonenumber-field>=8.4.0,<9.0.0",
    "pytest-django>=4.12.0,<5.0.0",
]

authors = [
    { name = "Jonne Saloranta" }
]

license = { text = "MIT" }

keywords = ["django", "usermodel"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
opencrm = [
    "templates/**/*",
    "static/**/*",
]

[tool.setuptools.packages.find]
where = ["."]